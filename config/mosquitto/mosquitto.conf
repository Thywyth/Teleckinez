# Mosquitto 2.x configuration for local development and demo.
# Anonymous access is fine for a single laptop; for a real deployment enable
# password_file + acl_file and a TLS listener on 8883 (see protocol.md §1).

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Keep retained device states (meta/availability/state) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
