# Mosquitto 2.x configuration for the native Windows build (no Docker).
# Same settings as mosquitto.conf; only the persistence path differs.
# Start: powershell -ExecutionPolicy Bypass -File scripts\mosquitto.ps1

listener 1883 127.0.0.1
protocol mqtt

listener 9001 127.0.0.1
protocol websockets

allow_anonymous true

# Relative to the project root (scripts\mosquitto.ps1 starts it from there).
persistence true
persistence_location data/mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
