# Teleckinez settings. Every key is optional: omitted keys use the defaults
# from src/teleckinez/core/config.py. Secrets (MQTT password) go to .env.

language: uk                # language of voice/text responses: uk | en

mqtt:
  host: 127.0.0.1
  port: 1883
  prefix: tkz               # topic prefix: tkz/dev/{id}/state ...
  keepalive_s: 10
  client_id: teleckinez-assistant
  tasmota_root: ""          # Tasmota FullTopic prefix ("" = default cmnd/stat/tele)
  z2m_base_topic: zigbee2mqtt
  # username: teleckinez    # password: env TKZ_MQTT_PASSWORD

dispatcher:
  ack_timeout_s: 2.0        # no ack within this time -> retry / TIMEOUT_ACK
  max_attempts: 3           # including the first one
  retry_backoff_s: [0.5, 1.0]
  cmd_ttl_s: 5              # device ignores commands older than this
  state_timeout_s:          # ACCEPTED, but reported state did not converge -> TIMEOUT_STATE
    default: 3.0
    light: 2.0
    garage_gate: 12.0
  state_margin_s: 2.0       # moving devices: distance / speed + margin
  progress_messages: true   # say "Відкриваю..." right after ACCEPTED for long actions
  progress_min_s: 3.0

health:
  heartbeat_s: 10           # default device heartbeat (state is re-published this often)
  stale_factor: 3           # stale after 3 x heartbeat without any message
  check_interval_s: 1.0
  fresh_s: 30               # answers mention the age of older data ("дані 2 хв тому")

notifications:             # the assistant speaks up on its own (dispatcher.md §5)
  enabled: true
  offline: true             # "Замок вхідних дверей не на зв'язку"
  stale: true               # no heartbeat for 3 x heartbeat
  recovered: true           # "... знову на зв'язку" after a reported problem
  drift_critical: true      # a lock / gate changed state without a command
  cooldown_s: 60            # per device: a flapping device does not talk every second
  startup_grace_s: 10       # silence while retained messages arrive after start

nlu:
  mode: rule                # rule | llm | hybrid
  fuzzy_threshold: 85       # rapidfuzz score 0..100 for synonym matching
  min_confidence: 0.6       # below -> "не зрозумів"
  llm_model: qwen2.5:3b     # Ollama model for llm / hybrid modes (ollama pull qwen2.5:3b)
  ollama_host: http://127.0.0.1:11434
  llm_timeout_s: 10         # slower answers fall back to the rule parser
  llm_keep_alive: 10m       # keep the model loaded between requests
  hybrid_threshold: 0.8     # hybrid: rule results less sure than this go to the LLM

voice:
  trigger: vosk_kws         # vosk_kws | openwakeword | push_to_talk
  stt: vosk                 # vosk | whisper
  stt_lang: uk              # uk | en | auto
  tts: piper                # piper | sapi | text
  input_device: null        # microphone: index or name (python scripts/audio_check.py --list)
  output_device: null       # speaker / headphones; null = Windows default
  vad_aggressiveness: 2     # webrtcvad 0..3, higher = stricter about what is speech
  vad_start_frames: 3       # 3 x 30 ms of speech = the phrase started
  vad_end_silence_ms: 700   # this much silence = the phrase ended
  vad_pre_roll_ms: 300      # audio kept from before the detected start
  max_utterance_s: 8        # hard limit of one phrase
  no_speech_timeout_s: 5    # nobody spoke after the trigger -> back to idle

web:
  host: 127.0.0.1
  port: 8000

storage:
  path: data/teleckinez.db

simulator:
  latency_ms: [20, 80]      # random network + processing delay per message
