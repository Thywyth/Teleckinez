# NLU benchmark set (docs/specs/metrics.md E2, docs/specs/nlu.md §4).
#
# Every item is the phrase and the expected *outcome* after parsing and target
# resolution, so the rule parser and the LLM are compared on the same thing:
#   expect.kind     command | query
#   expect.action   canonical action (type aliases applied: "open" the lock -> unlock)
#   expect.devices  device ids from config/devices.yaml (commands: exact set;
#                   queries: these must be among the described devices)
#   expect.params   concrete parameters after resolution ({brightness: 40});
#                   a step is the signed change ({volume: -10})
#   expect.error    ambiguous (several rooms/devices fit) | reject (nothing must be sent:
#                   not a smart-home request or no such device)
# cat:   basic | case | noverb | group | param | step | query | ambiguous | stt | free | reject
# voice: true -> the phrase is also read aloud for E1 (scripts/record_dataset.py)
#
# Labels say what a person meant, not what any parser currently returns.

# ============================================================== Ukrainian
